version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: investigator
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: fraud_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://investigator:securepassword@db:5432/fraud_platform

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: